name: Empreintes des cartes

# Fingerprints of every official French card image, for recognition by image.
# Published on the "empreintes" branch; rebuilt every week for new sets.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node index-build.mjs fp-index.json
      - name: Publier sur la branche empreintes
        run: |
          dir="$RUNNER_TEMP/out"
          git fetch origin empreintes && git worktree add "$dir" origin/empreintes || git worktree add --orphan -b empreintes "$dir"
          cp fp-index.json "$dir/fp-index.json"
          cd "$dir"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Empreintes du $(date -u +%F)"
          git push origin HEAD:empreintes
