name: Banc d'essai

on:
  workflow_dispatch:
    inputs:
      cards:
        description: Nombre de cartes
        default: '100'
      seed:
        description: Graine du tirage (même graine = mêmes cartes)
        default: '1'
      app_ref:
        description: Version du site à tester (commit), vide = la dernière
        default: ''

permissions:
  contents: write # results are pushed to the banc-essai branch

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version du site à comparer
        if: inputs.app_ref != ''
        working-directory: .
        run: git checkout "${{ inputs.app_ref }}" -- app.js sync.js index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Empreintes des images officielles (gardées une semaine)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            tests/fp-index.bin
            tests/fp-ids.json
          key: fp-index-${{ hashFiles('fingerprint.js', 'tests/fp-node.mjs', 'tests/index-build.mjs') }}-${{ steps.week.outputs.week }}
      - run: test -f fp-index.bin || node index-build.mjs
      - run: node bench.mjs "${{ inputs.cards }}" "${{ inputs.seed }}"
      - run: cat bench-results/RESULTATS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les résultats sur la branche banc-essai
        run: |
          dir="$RUNNER_TEMP/out"
          git fetch origin banc-essai && git worktree add "$dir" origin/banc-essai || git worktree add --orphan -b banc-essai "$dir"
          name="$(date -u +%Y%m%d-%H%M%S)-graine${{ inputs.seed }}-${{ inputs.app_ref || github.sha }}"
          mkdir -p "$dir/$name"
          cp bench-results/* "$dir/$name/"
          cd "$dir"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -m "Banc d'essai $name"
          # Several runs may publish at once: replay on top of the latest results.
          for i in 1 2 3 4 5; do
            git push origin HEAD:banc-essai && exit 0
            sleep $((i * 3)); git fetch origin banc-essai && git rebase origin/banc-essai
          done
          exit 1
