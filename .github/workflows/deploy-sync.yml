name: Déployer le serveur de synchronisation

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.1
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Créer la base D1 si besoin
        run: |
          find_id() { $WRANGLER d1 list --json | jq -r '.[] | select(.name == "pokemon-estimation") | .uuid'; }
          DB_ID=$(find_id)
          if [ -z "$DB_ID" ]; then
            $WRANGLER d1 create pokemon-estimation
            DB_ID=$(find_id)
          fi
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml

      - name: Appliquer le schéma
        run: $WRANGLER d1 execute pokemon-estimation --remote --file schema.sql

      - name: Déployer le Worker
        run: $WRANGLER deploy
