name: Déployer le serveur de synchronisation

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.1
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Secrets pasted by hand often carry stray spaces, newlines or a "Bearer " prefix.
      - name: Vérifier les secrets
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$RAW_API_TOKEN" | sed 's/^[[:space:]]*Bearer[[:space:]]*//' | tr -d '[:space:]"')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]"')
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          STATUS=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify")
          if [ "$STATUS" != 200 ] || ! jq -e '.success' /tmp/verify.json >/dev/null; then
            echo "::error::Cloudflare refuse le jeton (HTTP $STATUS). Recolle uniquement le jeton (cfat_...) dans CLOUDFLARE_API_TOKEN et vérifie l'Account ID."
            jq -c '.errors' /tmp/verify.json || true
            exit 1
          fi
          echo "Jeton Cloudflare valide."

      - name: Créer la base D1 si besoin
        run: |
          set -euo pipefail
          find_id() { $WRANGLER d1 list --json | jq -r '.[] | select(.name == "pokemon-estimation") | .uuid'; }
          DB_ID=$(find_id)
          if [ -z "$DB_ID" ]; then
            $WRANGLER d1 create pokemon-estimation
            DB_ID=$(find_id)
          fi
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml

      - name: Appliquer le schéma
        run: $WRANGLER d1 execute pokemon-estimation --remote --file schema.sql

      - name: Déployer le Worker
        run: $WRANGLER deploy
