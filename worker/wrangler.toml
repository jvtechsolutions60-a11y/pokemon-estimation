name = "pokemon-estimation-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No request logs: we don't want IP addresses or timings stored anywhere.
[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://jvtechsolutions60-a11y.github.io,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "pokemon-estimation"
database_id = "__D1_DATABASE_ID__"

# Erase vaults unused for 2 years, every night.
[triggers]
crons = ["17 3 * * *"]

# Per-client request limits, counted in memory by Cloudflare (nothing stored).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Card images passed through for the edition comparison (up to 8 per photo).
[[ratelimits]]
name = "IMAGE_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }
